<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Új eszközök létrehozása</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

        <div class="container py-5">

            <h1 class="mb-4">Új eszközök létrehozása</h1>

            <form  id="eszkozForm">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label" for="">Név</label>
                        <input type="text" id="nev" class="form-control" required>
                     
                    </div>

                    <div class="col-md-6">

                        <label class="form-label" for="">Leltári szám</label>
                        <input type="text" id="leltariSzam" class="form-control" required>
                     
                    </div>

                    <div class="col-md-4">

                        <label class="form-label" for="">Kategória</label>
                        <input type="text" id="kategoria" class="form-control" required>
                     
                    </div>

                    <div class="col-md-4">

                        <label class="form-label" for="">Gyártó</label>
                        <input type="text" id="gyarto" class="form-control" required>
                     
                    </div>

                    <div class="col-md-4">

                        <label class="form-label" for="">Modell</label>
                        <input type="text" id="modell" class="form-control" required>
                     
                    </div>

                    <div class="col-md-4">

                        <label class="form-label" for="">Terem</label>
                        <input type="text" id="terem" class="form-control" required>
                     
                    </div>

                    <div class="col-md-4">

                        <label class="form-label" for="">Állapot</label>
                        <input type="text" id="allapot" class="form-control" required>
                     
                    </div>

                    <div class="col-md-4">

                        <label class="form-label" for="">Beszerzési ár</label>
                        <input type="number" id="beszerzesiAr" class="form-control" required>
                     
                    </div>

                    <div class="col-md-4">

                        <label class="form-label" for="">Beszerzés dátuma</label>
                        <input type="datetime" id="beszerzesDatuma" class="form-control" required>
                     
                    </div>

                    <div class="col-md-4">
                        <div class="form-check mt-4">

                        <label class="form-check-label" for="">Használatban van</label>
                        <input type="checkbox" id="hasznalatbanVan" class="form-check-input" required>
                        
                        </div>

                    </div>

                    <div class="col-md-4">
                        <div class="form-check mt-4">

                        <label class="form-check-label" for="">Kölcsönöthető</label>
                        <input type="checkbox" id="kolcsonotheto" class="form-check-input" required>
                        </div>

                    </div>

                    <button class="btn btn-Warning mt-4" type="submit">Létrehozás</button>

                </div>
                
            </form>

            <div id="uzenet" class="mt-3">...</div>
        </div>

    <script src="script.js"></script>
</body>
</html>
